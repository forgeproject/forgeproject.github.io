# Jekyll Configuration for Total Miner Community Pack + Lua API Reference
# GitHub Pages site for the Total Miner community

# Site settings
title: Total Miner Community Pack
description: Maps, mods, tools, and Lua API reference for Total Miner
url: "https://forgeproject.github.io"
baseurl: ""

# GitHub Pages settings
github_username: forgeproject
repository: forgeproject/forgeproject.github.io

# Theme - using minima (GitHub Pages default) for clean, professional look
theme: minima

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude files from Jekyll
exclude:
  - .gitignore
  - .git
  - .vs
  - Gemfile
  - Gemfile.lock
  - vendor

# Keep files
keep_files:
  - lua-api

# Output settings
source: .
destination: _site
permalink: /:categories/:year/:month/:day/:title/
timezone: UTC

# Minima theme customization
minima:
  social_links:
    github: forgeproject/forgeproject.github.io

# Collections
collections:
  docs:
    output: true
    permalink: /lua-api/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "lua-api"
      type: "docs"
    values:
      layout: "default"
